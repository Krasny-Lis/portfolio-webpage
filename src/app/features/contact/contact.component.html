<app-section [eyebrow]="t().contact.eyebrow" [title]="t().contact.title">
  <form class="contact-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ t().contact.nameLabel }}</span>
      <input type="text" formControlName="name" required />
      <span class="error" *ngIf="form.controls.name.invalid && form.controls.name.touched">{{ t().contact.nameError }}</span>
    </label>
    <label>
      <span>{{ t().contact.emailLabel }}</span>
      <input type="email" formControlName="email" required />
      <span class="error" *ngIf="form.controls.email.invalid && form.controls.email.touched">{{ t().contact.emailError }}</span>
    </label>
    <label>
      <span>{{ t().contact.messageLabel }}</span>
      <textarea rows="5" formControlName="message" required></textarea>
      <span class="error" *ngIf="form.controls.message.invalid && form.controls.message.touched">
        {{ t().contact.messageError }}
      </span>
    </label>
    <label class="checkbox">
      <input type="checkbox" formControlName="consent" required />
      <span>{{ t().contact.consentLabel }}</span>
      <span class="error" *ngIf="form.controls.consent.invalid && form.controls.consent.touched">
        {{ t().contact.consentError }}
      </span>
    </label>
    <button type="submit" [disabled]="facade.status() === 'pending'">{{ t().contact.submit }}</button>
    <p class="status status--success" *ngIf="facade.status() === 'success'">{{ t().contact.success }}</p>
    <p class="status status--error" *ngIf="facade.status() === 'error'">{{ facade.errorMessage() }}</p>
  </form>
  <div class="contact-info">
    <h3>{{ t().contact.otherChannels }}</h3>
    <ul>
      <li>
        <a href="mailto:sliwa.lis.krzysztof&#64;gmail.com">sliwa.lis.krzysztof&#64;gmail.com</a>
        <button type="button" (click)="copyEmail()">{{ t().contact.copy }}</button>
        <span class="status" *ngIf="copyFeedbackMessage()">{{ copyFeedbackMessage() }}</span>
      </li>
      <li>
        <a href="https://github.com/Krasny-Lis?tab=repositories" target="_blank" rel="noopener">GitHub</a>
      </li>
      <li>
        <a
          href="https://www.linkedin.com/in/krzysztof-%C5%9Bliwa-018747179/"
          target="_blank"
          rel="noopener"
          >LinkedIn</a
        >
      </li>
    </ul>
  </div>
</app-section>
