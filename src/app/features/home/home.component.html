<app-section
  [eyebrow]="t().home.eyebrow"
  [title]="t().home.title"
  [description]="t().home.description"
>
  <div class="home__hero">
    <div class="home__copy">
      <div class="home__cta">
        <a routerLink="/contact" class="btn btn--primary" data-cy="home-cta-contact">{{
          t().home.ctaContact
        }}</a>
        <a routerLink="/projects" class="btn btn--ghost" data-cy="home-cta-projects">{{
          t().home.ctaProjects
        }}</a>
      </div>
      <div class="home__tags">
        <app-chip *ngFor="let tag of t().home.tags; trackBy: trackByLabel" [label]="tag"></app-chip>
      </div>
    </div>
    <div class="home__photo" role="presentation"></div>
  </div>
  <div class="home__social" *ngIf="social$ | async as links">
    <span>{{ t().home.socialIntro }}</span>
    <a
      *ngFor="let link of links; trackBy: trackByLabel"
      [href]="link.url"
      target="_blank"
      rel="noopener"
      >{{ link.label }}</a
    >
  </div>
</app-section>
