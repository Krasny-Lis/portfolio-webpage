<app-section
  [eyebrow]="t().projects.eyebrow"
  [title]="t().projects.title"
  [description]="t().projects.description"
>
  <app-tag-filter
    [tags]="availableTags()"
    [active]="activeTags()"
    (toggle)="toggleTag($event)"
    (clear)="clearTags()"
  ></app-tag-filter>
  <app-project-list
    *ngIf="filteredProjects() as projects"
    [projects]="projects"
    [ownerView]="ownerView"
  ></app-project-list>
</app-section>
