<div class="tag-filter" role="group" [attr.aria-label]="t().projects.filterLabel">
  <button type="button" class="tag-filter__item" [class.tag-filter__item--active]="!active.length" (click)="clear.emit()">
    {{ t().projects.filterAll }}
  </button>
  <button
    type="button"
    class="tag-filter__item"
    *ngFor="let tag of tags"
    [class.tag-filter__item--active]="active.includes(tag)"
    (click)="onToggle(tag)"
  >
    {{ tag }}
  </button>
</div>
