<div class="project-list">
  <app-project-card
    *ngFor="let project of projects | slice:0:visibleCount()"
    [project]="project"
    [ownerView]="ownerView"
  ></app-project-card>
</div>
<button
  type="button"
  class="project-list__more"
  *ngIf="visibleCount() < projects.length"
  (click)="showMore()"
>
  Pokaż więcej projektów
</button>
<p class="project-list__empty" *ngIf="!projects.length">Brak projektów spełniających kryteria.</p>
