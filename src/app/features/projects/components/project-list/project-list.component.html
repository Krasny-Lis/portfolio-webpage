<div class="project-list">
  <app-project-card
    *ngFor="let project of projects | slice: 0 : visibleCount(); trackBy: trackProject"
    class="project-list__item"
    [style.view-transition-name]="transitionName(project)"
    [project]="project"
    [ownerView]="ownerView"
  ></app-project-card>
</div>
<button
  type="button"
  class="btn btn--primary project-list__more"
  *ngIf="visibleCount() < projects.length"
  (click)="showMore()"
>
  {{ t().projects.showMore }}
</button>
<p class="project-list__empty" *ngIf="!projects.length">{{ t().projects.empty }}</p>
