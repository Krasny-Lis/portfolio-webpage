<nav class="navbar" role="navigation" aria-label="Główna">
  <a routerLink="/" class="navbar__brand">Lisu.dev</a>
  <button
    class="navbar__toggle"
    type="button"
    (click)="drawer.open = !drawer.open"
    [attr.aria-expanded]="drawer.open"
    aria-controls="primary-menu"
  >
    <span class="sr-only">Menu</span>
    ☰
  </button>
  <div #drawer="drawer" appDrawer class="navbar__links" id="primary-menu">
    <a routerLink="/about" routerLinkActive="is-active" (click)="drawer.open = false">O mnie</a>
    <a routerLink="/skills" routerLinkActive="is-active" (click)="drawer.open = false">Umiejętności</a>
    <a routerLink="/projects" routerLinkActive="is-active" (click)="drawer.open = false">Projekty</a>
    <a routerLink="/contact" routerLinkActive="is-active" (click)="drawer.open = false">Kontakt</a>
    <button type="button" class="theme-toggle" (click)="toggleTheme(); drawer.open = false" [attr.aria-label]="modeLabel()">
      <span aria-hidden="true">{{ theme() === 'dark' ? '🌙' : '☀️' }}</span>
    </button>
    <div class="navbar__social" *ngIf="links$ | async as links">
      <a *ngFor="let link of links" [href]="link.url" target="_blank" rel="noopener" class="navbar__social-link">
        {{ link.label }}
      </a>
    </div>
  </div>
</nav>
