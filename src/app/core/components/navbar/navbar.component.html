<nav class="navbar" role="navigation" [attr.aria-label]="t().navbar.ariaLabel">
  <a routerLink="/" class="navbar__brand">Krzysztof Śliwa</a>
  <button
    class="navbar__toggle"
    type="button"
    (click)="drawer.open = !drawer.open"
    [attr.aria-expanded]="drawer.open"
    aria-controls="primary-menu"
  >
    <span class="sr-only">{{ t().navbar.menuLabel }}</span>
    ☰
  </button>
  <div #drawer="drawer" appDrawer class="navbar__links" id="primary-menu">
    <a
      *ngFor="let link of t().navbar.links"
      [routerLink]="link.path"
      routerLinkActive="is-active"
      (click)="drawer.open = false"
      >{{ link.label }}</a
    >
    <div
      class="navbar__languages"
      role="group"
      [attr.aria-label]="t().navbar.languageSwitcher.label"
      [style.--languages-count]="availableLanguages.length"
      [style.--active-index]="languageIndex()"
    >
      <button
        *ngFor="let lang of availableLanguages"
        type="button"
        class="navbar__language-btn"
        [class.navbar__language-btn--active]="language() === lang"
        (click)="setLanguage(lang); drawer.open = false"
        [attr.aria-pressed]="language() === lang"
      >
        {{ t().navbar.languageSwitcher.options[lang] }}
      </button>
    </div>
    <button
      type="button"
      class="theme-toggle"
      [class.theme-toggle--dark]="theme() === 'dark'"
      (click)="toggleTheme(); drawer.open = false"
      [attr.aria-label]="modeLabel()"
      [attr.aria-pressed]="theme() === 'dark'"
    >
      <span aria-hidden="true">{{ theme() === 'dark' ? '🌙' : '☀️' }}</span>
    </button>
    <div class="navbar__social" *ngIf="links$ | async as links">
      <a *ngFor="let link of links" [href]="link.url" target="_blank" rel="noopener" class="navbar__social-link">
        {{ link.label }}
      </a>
    </div>
  </div>
</nav>
