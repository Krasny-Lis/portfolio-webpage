<footer class="footer">
  <div class="footer__inner">
    <p>© {{ year }} Lisu – Angular Developer</p>
    <nav aria-label="Linki społecznościowe" class="footer__links" *ngIf="links$ | async as links">
      <a *ngFor="let link of links" [href]="link.url" target="_blank" rel="noopener">{{ link.label }}</a>
    </nav>
  </div>
</footer>
