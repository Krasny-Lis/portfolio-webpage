<footer class="footer">
  <div class="footer__inner">
    <p>© {{ year }} {{ t().footer.copyright }}</p>
    <nav [attr.aria-label]="t().footer.linksLabel" class="footer__links" *ngIf="links$ | async as links">
      <a *ngFor="let link of links" [href]="link.url" target="_blank" rel="noopener">{{ link.label }}</a>
    </nav>
  </div>
</footer>
